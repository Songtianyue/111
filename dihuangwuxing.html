<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>帝皇铠甲 五行环绕</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: #02020c;
            overflow: hidden;
        }
        .box{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* 五行旋转轨道 */
        .circle-track{
            position: absolute;
            width: 560px;
            height: 560px;
            transform: translate(-50%,-50%);
            left: 50%;
            top: 50%;
        }
        .five-element{
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 30px 10px currentColor;
        }
        .huo {color:#ff2b00; animation:rotate 8s linear infinite 0s;}
        .mu {color:#3cff47; animation:rotate 8s linear infinite 1.6s;}
        .shui {color:#29bbff; animation:rotate 8s linear infinite 3.2s;}
        .tu {color:#d49228; animation:rotate 8s linear infinite 4.8s;}
        .lei {color:#fff833; animation:rotate 8s linear infinite 6.4s;}

        @keyframes rotate{
            0%{transform: rotate(0deg) translateX(260px);}
            100%{transform: rotate(360deg) translateX(260px);}
        }
        /* 帝皇图片容器 */
        .image-wrap{
            z-index: 9;
        }
        .image-wrap img{
            width: 400px;
            filter: drop-shadow(0 0 40px gold);
        }
    </style>
</head>
<body>
<div class="box">
    <div class="circle-track">
        <div class="five-element huo"></div>
        <div class="five-element mu"></div>
        <div class="five-element shui"></div>
        <div class="five-element tu"></div>
        <div class="five-element lei"></div>
    </div>

    <div class="image-wrap">
        <!-- 在线帝皇铠甲图片链接，无需本地图片 -->
        <img src="https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/4000d404993c41389d42a012f190d311~tplv-a9rns2rl98-image.image">
    </div>
</div>
</body>
</html>
