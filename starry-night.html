<!DOCTYPE html>
<html>
<body style="margin:0;overflow:hidden;background:#000;">
<canvas id="starfield"></canvas>
<script>
const c=document.getElementById('starfield'),ctx=c.getContext('2d');
let w=c.width=innerWidth,h=c.height=innerHeight,stars=[];
for(let i=0;i<800;i++)stars.push({
x:Math.random()*w,
y:Math.random()*h,
r:Math.random()*1.5,
s:Math.random()*0.5+0.2
});
function draw(){
ctx.fillStyle='#000';
ctx.fillRect(0,0,w,h);
ctx.fillStyle='#fff';
stars.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
s.y+=s.s;
if(s.y>h)s.y=0;
});
requestAnimationFrame(draw);
}
draw();
window.onresize=()=>{
w=c.width=innerWidth;
h=c.height=innerHeight;
};
</script>
</body>
</html>
